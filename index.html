<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>去过的地方和想去的地方 · 旷野版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&family=Noto+Sans+SC:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   主题 · 晨光（默认）/ 星夜
   ============================================================ */
:root{
  --sky-0:#0B2740;   /* 天顶 */
  --sky-1:#1F4E78;
  --sky-2:#4C82AC;
  --sky-3:#8FB6CE;
  --sky-4:#CFE0E6;   /* 近地平线 */
  --glow:#F2E2C0;    /* 地平线暖光 */
  --land:#F5F2EA;    /* 大地 / 纸 */
  --ink:#1C2320;
  --ink-soft:#6A7169;
  --ink-faint:#9AA196;
  --seal:#C0422F;    /* 朱砂 · 已抵达 */
  --wish:#7C8781;    /* 在路上 */
  --on-sky:#FFFFFF;
  --on-sky-soft:rgba(255,255,255,.72);
  --rule:rgba(28,35,32,.13);
  --rule-strong:rgba(28,35,32,.28);
  --haze:rgba(255,255,255,.9);
  --font-title:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong',serif;
  --font-body:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;
  --gut:clamp(20px,5vw,64px);
  --wrap:1240px;
}
[data-theme="night"]{
  --sky-0:#05080F; --sky-1:#0B1626; --sky-2:#152C42; --sky-3:#22415A;
  --sky-4:#33566F; --glow:#6E7F88; --land:#0D1319;
  --ink:#E6E3D9; --ink-soft:#8A928C; --ink-faint:#5B6660;
  --seal:#E0A94A; --wish:#5F7078;
  --on-sky:#FFFFFF; --on-sky-soft:rgba(255,255,255,.66);
  --rule:rgba(230,227,217,.13); --rule-strong:rgba(230,227,217,.3);
  --haze:rgba(10,16,24,.85);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--land);color:var(--ink);font-family:var(--font-body);
  font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;
  transition:background .5s ease,color .5s ease;overflow-x:hidden}
:where(a,button,input,[tabindex]):focus-visible{outline:2px solid var(--seal);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ============================================================
   HERO · 天空（固定的一整片天）
   ============================================================ */
.sky{
  position:fixed;inset:0;height:100vh;z-index:0;
  background:linear-gradient(180deg,
    var(--sky-0) 0%, var(--sky-1) 20%, var(--sky-2) 42%,
    var(--sky-3) 62%, var(--sky-4) 76%, var(--glow) 82%, var(--land) 88%);
  transition:opacity .2s linear;
}

/* --- 极高的薄云，慢到几乎察觉不到 --- */
.cloud{position:absolute;border-radius:50%;filter:blur(28px);opacity:.5;will-change:transform}
.c1{width:340px;height:52px;top:14%;left:-20%;background:rgba(255,255,255,.5); animation:drift 190s linear infinite}
.c2{width:220px;height:36px;top:26%;left:-15%;background:rgba(255,255,255,.34);animation:drift 260s linear infinite 40s}
.c3{width:460px;height:64px;top:8%; left:-30%;background:rgba(255,255,255,.22);animation:drift 340s linear infinite 90s}
.c4{width:180px;height:30px;top:38%;left:-10%;background:rgba(255,255,255,.28);animation:drift 210s linear infinite 15s}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(180vw)}}
[data-theme="night"] .cloud{background:rgba(190,215,235,.16);filter:blur(34px)}

/* --- 星（仅夜航） --- */
.stars{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}
[data-theme="night"] .stars{opacity:1}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
  animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.22}50%{opacity:.95}}

/* --- 远山 · 三层大气透视（越远越淡越蓝） --- */
.ridge{position:absolute;left:0;right:0;bottom:0;width:100%;pointer-events:none}
.ridge svg{width:100%;height:100%;display:block}
.ridge.r3{bottom:0;height:26vh;opacity:.30}   /* 最远 */
.ridge.r2{bottom:0;height:19vh;opacity:.52}
.ridge.r1{bottom:0;height:12vh;opacity:.85}   /* 最近 */
.ridge path{fill:var(--ridge-fill)}
.ridge.r3{--ridge-fill:#2F5678}
.ridge.r2{--ridge-fill:#1E405C}
.ridge.r1{--ridge-fill:#122A3C}
[data-theme="night"] .ridge.r3{--ridge-fill:#1B3040}
[data-theme="night"] .ridge.r2{--ridge-fill:#111F2B}
[data-theme="night"] .ridge.r1{--ridge-fill:#080F16}

/* --- 航迹：一条划向远方的虚线弧 + 沿轨迹飞行的剪影 --- */
.track{position:absolute;left:0;right:0;top:0;height:100vh;pointer-events:none}
.track svg{width:100%;height:100%}
.track path{fill:none;stroke:rgba(255,255,255,.34);stroke-width:1.2;stroke-dasharray:3 9}
.flyer{opacity:.85}

/* --- Hero 内容 --- */
.hero{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;
  justify-content:center;padding:0 var(--gut)}
.hero h1{color:var(--on-sky);font-family:var(--font-title);font-weight:700;
  font-size:clamp(2.6rem,10.5vw,8.5rem);line-height:1.02;letter-spacing:.02em;
  text-shadow:0 2px 40px rgba(0,0,0,.18);max-width:14ch}
.hero h1 .thin{display:block;font-weight:300;font-size:.34em;letter-spacing:.34em;
  margin-top:.55em;opacity:.82;max-width:none}
.hero .sub{margin-top:clamp(24px,4vw,44px);color:var(--on-sky-soft);font-weight:200;
  font-size:clamp(.95rem,1.8vw,1.2rem);max-width:34ch;line-height:1.9;
  letter-spacing:.04em}
.hero .scrollcue{margin-top:clamp(40px,7vw,88px);display:flex;align-items:center;gap:14px;
  color:var(--on-sky-soft);font-size:11px;letter-spacing:.26em;text-transform:uppercase}
.hero .scrollcue .ln{width:52px;height:1px;background:currentColor;transform-origin:left;
  animation:cue 2.6s ease-in-out infinite}
@keyframes cue{0%,100%{transform:scaleX(.35);opacity:.5}50%{transform:scaleX(1);opacity:1}}

/* ============================================================
   地面 · 内容区（滚动上来，覆盖天空）
   ============================================================ */
.ground{position:relative;z-index:3;background:var(--land);
  border-radius:26px 26px 0 0;
  box-shadow:0 -30px 80px rgba(0,0,0,.10);
  margin-top:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
main{padding:clamp(56px,9vw,120px) 0 clamp(48px,7vw,96px)}

/* --- 进度：数字要有重量 --- */
.tally{display:flex;align-items:flex-end;gap:clamp(24px,5vw,64px);flex-wrap:wrap}
.tally .fig{display:flex;flex-direction:column;gap:6px}
.tally .n{font-family:var(--font-title);font-size:clamp(3.4rem,9vw,7rem);font-weight:700;
  line-height:.86;letter-spacing:-.03em}
.tally .n.seal{color:var(--seal)}
.tally .n.mute{color:var(--ink-faint)}
.tally .cap{font-size:11px;letter-spacing:.24em;color:var(--ink-faint);text-transform:uppercase}
.tally .note{margin-left:auto;max-width:26ch;font-family:var(--font-title);font-weight:300;
  font-size:clamp(.95rem,1.7vw,1.15rem);color:var(--ink-soft);line-height:1.75}
.rail{margin-top:clamp(24px,4vw,40px);height:1px;background:var(--rule);position:relative}
.rail i{position:absolute;inset:0 auto 0 0;background:var(--seal);height:1px;width:7.8%}
.rail b{position:absolute;top:-4px;left:7.8%;width:9px;height:9px;border-radius:50%;
  background:var(--seal);transform:translateX(-50%)}

/* --- 搜索 --- */
.find{max-width:560px;margin:clamp(40px,6vw,76px) 0 0}
.find form{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--rule-strong);
  padding-bottom:11px;transition:border-color .25s}
.find form:focus-within{border-color:var(--seal)}
.find svg{color:var(--ink-faint);flex:none}
.find form:focus-within svg{color:var(--seal)}
.find input{flex:1;border:0;background:transparent;outline:none;font-family:var(--font-title);
  font-size:1.05rem;color:var(--ink);min-width:0}
.find input::placeholder{color:var(--ink-faint)}
.find .clear{border:0;background:transparent;color:var(--ink-faint);cursor:pointer;display:none;font-size:1rem}
.find .clear.on{display:block}
.find .count{font-size:12px;color:var(--ink-faint);margin-top:11px;letter-spacing:.06em;min-height:18px}
.find .count b{color:var(--seal)}

/* --- 区块 --- */
.sec{margin-top:clamp(64px,11vw,140px)}
.sec-h{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px solid var(--rule);margin-bottom:clamp(26px,4.5vw,48px)}
.sec-h h2{font-family:var(--font-title);font-size:clamp(1.4rem,3vw,2.2rem);font-weight:700;letter-spacing:.03em}
.sec-h .n{font-family:var(--font-title);color:var(--ink-faint);font-weight:300}
.sec-h .d{margin-left:auto;font-size:12.5px;color:var(--ink-faint);font-weight:300;letter-spacing:.05em}

/* --- 地名流：带一点点风的不规则 --- */
.flow{font-family:var(--font-title);font-size:clamp(1.05rem,2.2vw,1.5rem);
  line-height:2.5;display:flex;flex-wrap:wrap;column-gap:1em}
.flow .sep{color:var(--ink-faint);font-size:.72em;transform:translateY(-.1em);opacity:.5}

.reached .pl{position:relative;display:inline-flex;align-items:baseline;gap:.4em;
  color:var(--ink);text-decoration:none;transition:color .3s ease}
.reached .pl .dot{width:.4em;height:.4em;border-radius:50%;background:var(--seal);flex:none;
  transform:translateY(-.18em)}
.reached .pl::after{content:"";position:absolute;left:0;right:0;bottom:.22em;height:1px;
  background:var(--seal);transform:scaleX(0);transform-origin:left;
  transition:transform .4s cubic-bezier(.2,.7,.3,1)}
.reached .pl:hover{color:var(--seal)}
.reached .pl:hover::after{transform:scaleX(1)}

/* 在路上：散落、被风吹过 —— 每个都有微小的垂直偏移（--dy 由内联注入） */
.wish .pl{color:var(--wish);font-weight:300;position:relative;cursor:default;
  display:inline-block;font-size:var(--fs,1em);transform:translateY(var(--dy,0px));
  transition:color .35s ease,transform .35s ease}
.wish .pl:hover{color:var(--seal);transform:translateY(calc(var(--dy,0px) - 3px))}
.wish .pl::after{content:"";position:absolute;left:0;right:0;bottom:.24em;height:1px;
  background:currentColor;opacity:.4;transform:scaleX(0);transform-origin:left;
  transition:transform .4s cubic-bezier(.2,.7,.3,1)}
.wish .pl:hover::after{transform:scaleX(1)}

.flow .pl.dim{opacity:.13;transition:opacity .35s ease}
.flow .pl.hit{color:var(--seal);opacity:1}
.flow .pl.hit::after{transform:scaleX(1)}

/* 联程：一趟走完的几个地方，用「+」合并，虚线框住表示同一篇 */
.trip{display:inline-flex;align-items:baseline;padding-bottom:3px;
  border-bottom:1px dashed var(--rule-strong)}
.plus{color:var(--seal);font-size:.72em;font-weight:400;margin:0 .2em;transform:translateY(-.06em)}

/* --- 分区 --- */
.grp{margin-top:clamp(30px,4.5vw,52px)}
.grp:first-child{margin-top:0}
.grp-h{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;
  padding:8px 0;cursor:pointer;font-family:var(--font-body);font-size:11.5px;letter-spacing:.2em;
  color:var(--ink-faint);text-transform:uppercase;text-align:left;transition:color .25s;min-height:34px}
.grp-h:hover{color:var(--ink)}
.grp-h .idx{font-family:var(--font-title);letter-spacing:0;font-size:12px;color:var(--seal);min-width:1.8em}
.grp-h .t{flex:1}
.grp-h .c{font-size:10.5px;letter-spacing:.1em}
.grp-h .arw{transition:transform .3s ease}
.grp-h[aria-expanded="false"] .arw{transform:rotate(-90deg)}
.grp-b{display:grid;grid-template-rows:1fr;transition:grid-template-rows .34s cubic-bezier(.2,.7,.3,1)}
.grp-b>.in{overflow:hidden;min-height:0}
.grp-b.collapsed{grid-template-rows:0fr}
.grp-b.collapsed>.in{visibility:hidden;transition:visibility 0s linear .34s}

/* --- Footer --- */
footer{margin-top:clamp(64px,10vw,120px);padding-top:clamp(28px,4vw,44px);
  border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:20px;
  flex-wrap:wrap;font-size:12px;color:var(--ink-faint);letter-spacing:.06em}

/* --- 控件 --- */
.tools{position:fixed;right:clamp(14px,2.5vw,28px);bottom:clamp(14px,2.5vw,28px);
  display:flex;flex-direction:column;gap:9px;z-index:40}
.tools button{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule-strong);
  background:var(--land);color:var(--ink-soft);cursor:pointer;display:grid;place-items:center;
  font-size:15px;font-family:var(--font-title);transition:all .22s ease}
.tools button:hover{color:var(--seal);border-color:var(--seal);transform:translateY(-2px)}
.tools button:active{transform:scale(.93)}
.tools button[hidden]{display:none}

.switcher{position:fixed;left:clamp(14px,2.5vw,28px);bottom:clamp(14px,2.5vw,28px);z-index:40;
  background:var(--land);border:1px solid var(--rule-strong);border-radius:999px;padding:5px;
  display:flex;gap:2px}
.switcher button{border:0;background:transparent;color:var(--ink-faint);cursor:pointer;
  font-family:var(--font-body);font-size:11.5px;letter-spacing:.06em;padding:7px 14px;border-radius:999px;
  transition:background .22s,color .22s}
.switcher button:hover{color:var(--ink)}
.switcher button.on{background:var(--ink);color:var(--land)}
@media (max-width:720px){
  .switcher{left:50%;transform:translateX(-50%);bottom:12px}
  .tools{bottom:66px}
}
</style>
</head>

function esc(s){return String(s).replace(/[&<>"']/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}

/* 已抵达 —— 同一趟旅程（trip 相同）的地名用「+」连成一组，
   因为数据模型是「一次出行 = 一篇攻略」，不是「一个地名 = 一篇」 */
document.getElementById('flowReached').innerHTML = (function(){
  var groups=[], seen={};
  P.filter(function(p){return p[3]===1}).forEach(function(p){
    var k = p[5] || ('#'+p[0]);
    if(!seen[k]){ seen[k]=[]; groups.push(seen[k]) }
    seen[k].push(p);
  });
  return groups.map(function(g,gi){
    var inner = g.map(function(p,i){
      return (i?'<span class="plus" aria-hidden="true">+</span>':'')+
        '<a class="pl" href="'+esc(p[4])+'" data-n="'+esc(p[0])+'"><i class="dot"></i>'+esc(p[0])+'</a>';
    }).join('');
    var html = g.length>1
      ? '<span class="trip" title="一趟走完 · 同一篇攻略">'+inner+'</span>'
      : inner;
    return (gi?'<span class="sep">·</span>':'') + html;
  }).join('');
})();

/* 在路上 —— 每个给一点随机的垂直偏移与字号浮动，像被风吹散在原野上 */
var seed=7;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
document.getElementById('wishGroups').innerHTML = (function(){
  var gi=0, out=[];
  ORDER.forEach(function(g){
    var list=P.filter(function(p){return p[1]===g && p[3]===0});
    if(!list.length) return;
    var gone=P.filter(function(p){return p[1]===g && p[3]===1}).length;
    gi++; var id='wg'+gi;
    out.push('<div class="grp">'+
      '<button class="grp-h" aria-expanded="true" aria-controls="'+id+'">'+
        '<span class="idx">'+String(gi).padStart(2,'0')+'</span>'+
        '<span class="t">'+esc(g)+'</span>'+
        '<span class="c">'+list.length+' 处'+(gone?' · 已去 '+gone:'')+'</span>'+
        '<svg class="arw" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'+
      '</button>'+
      '<div class="grp-b" id="'+id+'"><div class="in"><div class="flow">'+
      list.map(function(p,i){
        var dy=((rnd()*2-1)*5).toFixed(1);      /* ±5px 垂直漂移 */
        var fs=(0.94+rnd()*0.14).toFixed(3);    /* 0.94–1.08em 字号浮动 */
        /* 用 CSS 变量注入，避免内联 transform 盖掉 hover 效果 */
        return (i?'<span class="sep">·</span>':'')+
          '<span class="pl" data-n="'+esc(p[0])+'" style="--dy:'+dy+'px;--fs:'+fs+'em">'+esc(p[0])+'</span>';
      }).join('')+
      '</div></div></div></div>');
  });
  return out.join('');
})();

/* 搜索：不匹配的退到背景，不消失 */
var q=document.getElementById('q'), clr=document.getElementById('clr'), qc=document.getElementById('qc');
var nodes=[].slice.call(document.querySelectorAll('.pl'));
q.addEventListener('input',function(){
  var v=q.value.trim().toLowerCase();
  clr.classList.toggle('on', !!v);
  if(!v){ nodes.forEach(function(n){n.classList.remove('dim','hit')}); qc.textContent=''; return }
  var hit=0;
  nodes.forEach(function(n){
    var m=n.dataset.n.toLowerCase().indexOf(v)>-1;
    n.classList.toggle('hit',m); n.classList.toggle('dim',!m);
    if(m) hit++;
  });
  qc.innerHTML = hit? '匹配到 <b>'+hit+'</b> 个地方' : '还没有这个地方 —— 要不要把它加进天空？';
});
q.addEventListener('keydown',function(e){if(e.key==='Escape'){q.value='';q.dispatchEvent(new Event('input'))}});
clr.addEventListener('click',function(){q.value='';q.dispatchEvent(new Event('input'));q.focus()});

/* 折叠 */
document.addEventListener('click',function(e){
  var h=e.target.closest('.grp-h'); if(!h) return;
  var b=document.getElementById(h.getAttribute('aria-controls'));
  var open=h.getAttribute('aria-expanded')==='true';
  h.setAttribute('aria-expanded', !open);
  b.classList.toggle('collapsed', open);
  syncFold();
});
function syncFold(){
  var any=[].slice.call(document.querySelectorAll('.grp-h')).some(function(h){return h.getAttribute('aria-expanded')==='true'});
  document.getElementById('foldBtn').textContent = any?'−':'+';
}
document.getElementById('foldBtn').addEventListener('click',function(){
  var hs=[].slice.call(document.querySelectorAll('.grp-h'));
  var any=hs.some(function(h){return h.getAttribute('aria-expanded')==='true'});
  hs.forEach(function(h){
    h.setAttribute('aria-expanded', !any);
    document.getElementById(h.getAttribute('aria-controls')).classList.toggle('collapsed', any);
  });
  syncFold();
});

/* 回到顶部 + 天空视差 */
var tb=document.getElementById('topBtn'), sky=document.getElementById('sky');
var ticking=false;
addEventListener('scroll',function(){
  if(!ticking){ ticking=true; requestAnimationFrame(function(){
    var y=scrollY, vh=innerHeight;
    tb.hidden = y < vh*0.5;
    /* 天空比内容慢 —— 纵深感的来源 */
    sky.style.transform = 'translateY(' + (y*0.28) + 'px)';
    sky.style.opacity = Math.max(0, 1 - y/(vh*0.95));
    ticking=false;
  })}
},{passive:true});
tb.addEventListener('click',function(){scrollTo({top:0,behavior:'smooth'})});

/* 时段切换 */
[].slice.call(document.querySelectorAll('.switcher button')).forEach(function(b){
  b.addEventListener('click',function(){
    [].slice.call(document.querySelectorAll('.switcher button')).forEach(function(x){
      x.classList.remove('on'); x.setAttribute('aria-pressed','false')});
    b.classList.add('on'); b.setAttribute('aria-pressed','true');
    document.body.setAttribute('data-theme', b.dataset.t);
  });
});

/* 数字滚动 */
requestAnimationFrame(function(){
  [].slice.call(document.querySelectorAll('[data-count]')).forEach(function(el){
    var t=+el.dataset.count, s=performance.now(), d=1100;
    (function step(now){
      var k=Math.min(1,(now-s)/d), e=1-Math.pow(1-k,3);
      el.textContent=Math.round(t*e);
      if(k<1) requestAnimationFrame(step);
    })(s);
  });
});
