<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>北京4天3晚旅游攻略 · Mao 的旅行攻略</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   北京 · 地域设计系统
   母题：中轴线 / 宫墙 / 琉璃瓦 / 窗棂 / 银杏
   ============================================================ */
:root{
  --sky-0:#0B2740; --sky-1:#1F4E78; --sky-2:#4C82AC; --sky-3:#8FB6CE;
  --sky-4:#CFE0E6; --glow:#F2E2C0;
  --paper:#F5F2EA;
  --ink:#1C2320; --ink-soft:#6A7169; --ink-faint:#9AA196;

  --wall:#A8352A;        /* 宫墙红 */
  --wall-deep:#7E241C;
  --glaze:#B8892B;       /* 琉璃瓦金 */
  --brick:#6B6157;       /* 青砖灰 */
  --ginkgo:#D9A441;      /* 银杏 */

  --rule:rgba(28,35,32,.12);
  --rule-strong:rgba(28,35,32,.26);
  --font-title:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong',serif;
  --font-body:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  --gut:clamp(20px,5vw,56px);
  --wrap:1080px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);
  font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:where(a,button,input,[tabindex]):focus-visible{outline:2px solid var(--wall);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   HERO · 北京天际线（左：宫檐 / 右：现代楼群）
   ============================================================ */
.hero{position:relative;min-height:clamp(360px,56vh,560px);display:flex;flex-direction:column;
  justify-content:flex-end;padding:0 var(--gut) clamp(30px,5vw,52px);overflow:hidden;
  background:linear-gradient(180deg,var(--sky-0) 0%,var(--sky-1) 26%,var(--sky-2) 52%,
    var(--sky-3) 74%,var(--sky-4) 88%,var(--glow) 96%,var(--paper) 100%)}
.sky-orn{position:absolute;inset:0;width:100%;height:100%}
.sky-orn .far{fill:#2F5678;opacity:.3}
.sky-orn .mid{fill:#1E405C;opacity:.5}
.sky-orn .palace{fill:#122A3C;opacity:.9}
.sky-orn .tower{fill:#122A3C;opacity:.78}
.sky-orn .win{fill:var(--glow);opacity:.5}

/* 印章 */
.seal{position:absolute;right:var(--gut);top:clamp(64px,10vw,96px);width:76px;height:76px;
  border:2.5px solid rgba(255,255,255,.85);border-radius:8px;display:grid;place-items:center;
  color:#fff;font-family:var(--font-title);font-size:2.1rem;font-weight:700;letter-spacing:0;
  opacity:.92;transform:rotate(4deg)}
.seal::after{content:"北 京";position:absolute;bottom:-26px;right:2px;font-size:11px;
  letter-spacing:.34em;font-family:var(--font-body);font-weight:400;opacity:.8}

.hero .back{position:absolute;top:clamp(16px,3vw,28px);left:var(--gut);z-index:5;
  display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;
  text-decoration:none;font-size:13px;letter-spacing:.05em;backdrop-filter:blur(8px);
  transition:background .25s ease,transform .25s ease}
.hero .back:hover{background:rgba(255,255,255,.26);transform:translateY(-2px)}

.hero .inner{position:relative;z-index:3;max-width:var(--wrap);margin:0 auto;width:100%}
.hero .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(255,255,255,.68);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.hero .eyebrow::after{content:"";width:46px;height:1px;background:rgba(255,255,255,.45)}
.hero h1{font-family:var(--font-title);font-weight:700;color:#fff;
  font-size:clamp(2.2rem,7vw,4.6rem);line-height:1.04;letter-spacing:.04em;
  text-shadow:0 2px 32px rgba(0,0,0,.22)}
.hero .sub{margin-top:14px;color:rgba(255,255,255,.82);font-weight:300;
  font-size:clamp(.95rem,1.8vw,1.12rem);max-width:38ch;letter-spacing:.03em}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:clamp(18px,3vw,26px)}
.hero .meta span{font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.92);
  padding:5px 13px;border-radius:2px;background:rgba(168,53,42,.42);
  border:1px solid rgba(255,255,255,.26)}

/* ============================================================
   地面
   ============================================================ */
.ground{position:relative;z-index:3;background:var(--paper);border-radius:22px 22px 0 0;
  margin-top:-1px;box-shadow:0 -20px 60px rgba(0,0,0,.08)}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
main{padding:clamp(44px,7vw,76px) 0 clamp(48px,7vw,88px)}

.sec{margin-top:clamp(48px,8vw,88px);scroll-margin-top:20px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:14px;
  border-bottom:1px solid var(--rule);margin-bottom:clamp(22px,4vw,34px)}
.sec-h h2{font-family:var(--font-title);font-size:clamp(1.3rem,2.8vw,1.9rem);font-weight:700;letter-spacing:.04em}
.sec-h .n{font-family:var(--font-title);color:var(--ink-faint);font-size:.92rem;font-weight:300}
.sec-h .d{margin-left:auto;font-size:12px;color:var(--ink-faint);letter-spacing:.05em}

/* 中式分隔（替代普通 hr） */
.part{display:flex;align-items:center;gap:12px;margin:clamp(34px,6vw,56px) 0;color:var(--glaze)}
.part::before,.part::after{content:"";flex:1;height:1px;background:var(--rule)}
.part i{width:7px;height:7px;background:var(--glaze);transform:rotate(45deg);flex:none}
.part i+i{margin-left:-6px;opacity:.5}

/* ============================================================
   预约 · 北京的头等大事
   ============================================================ */
.book{position:relative;border:1px solid rgba(168,53,42,.28);border-radius:14px;
  background:linear-gradient(180deg,rgba(168,53,42,.05),rgba(168,53,42,.015));
  padding:clamp(20px,3.4vw,32px);overflow:hidden}
/* 窗棂纹理 */
.book::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    linear-gradient(var(--rule) 1px,transparent 1px),
    linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:radial-gradient(120% 90% at 100% 0%,#000 0%,transparent 72%);
  -webkit-mask-image:radial-gradient(120% 90% at 100% 0%,#000 0%,transparent 72%)}
.book .hd{position:relative;display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.book .hd .tag{background:var(--wall);color:#fff;font-size:11px;font-weight:600;letter-spacing:.14em;
  padding:5px 11px;border-radius:2px;flex:none;margin-top:4px}
.book .hd h3{font-family:var(--font-title);font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:700;color:var(--wall-deep)}
.book .lead{position:relative;font-size:.94rem;color:var(--ink-soft);margin:8px 0 18px;max-width:56ch;line-height:1.8}
.book .lead b{color:var(--wall-deep);font-weight:600}

/* 抢票倒计时条 */
.rush{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:#fff;border:1px solid rgba(184,137,43,.4);border-left:3px solid var(--glaze);
  border-radius:0 8px 8px 0;padding:13px 16px;margin-bottom:18px}
.rush .k{font-family:var(--font-title);font-weight:700;color:var(--glaze);font-size:1rem;flex:none}
.rush .v{font-size:.9rem;color:var(--ink)}
.rush .v b{color:var(--wall-deep)}
.rush .clock{margin-left:auto;font-size:11px;letter-spacing:.1em;color:var(--ink-faint);
  border:1px solid var(--rule-strong);border-radius:2px;padding:4px 9px}

/* 预约卡片（替代 5 列表格 —— 手机上不再横滑，双列网格自适应） */
.bk{position:relative;background:#fff;border:1px solid var(--rule);border-radius:10px;
  padding:14px 16px 15px;transition:border-color .22s,box-shadow .22s,transform .22s}
.bk:hover{border-color:var(--rule-strong);box-shadow:0 4px 14px rgba(28,35,32,.06);transform:translateY(-1px)}
.bk-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-right:4px}
.bk-t h4{font-family:var(--font-title);font-size:1.02rem;font-weight:700;color:var(--ink);letter-spacing:.04em}
/* 抢票关键行：唯一需要一眼看到的信息 */
.bk-when{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:9px;
  padding:6px 11px;border-radius:6px;background:rgba(184,137,43,.10)}
.bk-when .d{font-size:.82rem;color:var(--ink-soft);letter-spacing:.02em}
.bk-when .d b{font-family:var(--font-title);font-size:1.1rem;color:var(--glaze);font-weight:700;padding:0 1px}
.bk-when .t{margin-left:auto;font-size:.8rem;font-weight:600;color:var(--wall-deep);letter-spacing:.04em}
.bk-m{margin:10px 0 0;font-size:.8rem;line-height:1.72}
.bk-m .row{display:flex;gap:8px}
.bk-m dt{flex:none;color:var(--ink-faint);letter-spacing:.06em;min-width:2.4em}
.bk-m dd{margin:0;flex:1;min-width:0;color:var(--ink-soft)}
.bk.urgent{border-color:rgba(184,137,43,.45);background:#FDFAF2}
.bk.urgent::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;
  border-radius:0 3px 3px 0;background:var(--glaze)}
.badge{display:inline-block;font-size:10.5px;letter-spacing:.08em;padding:2px 7px;border-radius:2px;
  background:var(--glaze);color:#fff;font-weight:600;vertical-align:2px}

/* 常规物品 chips —— 轻量层级，区别于上面带理由的卡片 */
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.chips li{display:inline-flex;align-items:center;gap:7px;background:#fff;
  border:1px solid var(--rule);border-radius:999px;padding:7px 14px 7px 11px;
  font-size:.86rem;color:var(--ink);line-height:1.4;transition:border-color .2s,transform .2s}
.chips li:hover{border-color:var(--rule-strong);transform:translateY(-1px)}
.chips .ic{width:15px;height:15px;flex:none;color:var(--brick)}

/* ============================================================
   行李清单 · 三级 + 图标 + 北京专属理由
   ============================================================ */
.kit{margin-top:22px}
.kit .lvl{margin-top:24px}
.kit .lvl:first-child{margin-top:0}
.kit .lvl-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.kit .lvl-h .dot{width:8px;height:8px;border-radius:50%;flex:none}
.kit .lvl-h b{font-family:var(--font-title);font-size:1rem;font-weight:700;color:var(--ink);letter-spacing:.08em}
.kit .lvl-h span{font-size:11px;letter-spacing:.12em;color:var(--ink-faint)}
.kit .lvl-h::after{content:"";flex:1;height:1px;background:var(--rule)}
.kit .lv1 .dot{background:var(--wall)}
.kit .lv2 .dot{background:var(--glaze)}
.kit .lv3 .dot{background:var(--brick)}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--rule);
  border-radius:10px;padding:13px 15px;transition:border-color .22s,box-shadow .22s,transform .22s}
.item:hover{border-color:var(--rule-strong);box-shadow:0 4px 14px rgba(28,35,32,.06);transform:translateY(-1px)}
.item .ic{font-size:20px;margin-top:2px;color:var(--wall)}
.item.lv2 .ic{color:var(--glaze)}
.item.lv3 .ic{color:var(--brick)}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:.95rem;font-weight:600;color:var(--ink)}
.item .tx small{display:block;font-size:.83rem;color:var(--ink-soft);line-height:1.6;margin-top:2px}
/* 北京专属理由 —— 这是"有北京特色"的关键 */
.item .tx em{display:inline-block;font-style:normal;font-size:.78rem;color:var(--wall-deep);
  background:rgba(168,53,42,.08);border-radius:2px;padding:1px 7px;margin-top:5px;letter-spacing:.03em}
.item .tx em::before{content:"京 · "}

/* 提示条 */
.note{display:flex;gap:13px;align-items:flex-start;background:#FBF3DF;border-left:3px solid var(--glaze);
  border-radius:0 8px 8px 0;padding:13px 17px;margin:20px 0;font-size:.93rem;line-height:1.7}
.note b{color:#8A6D2F;font-weight:600}
.note.red{background:rgba(168,53,42,.07);border-left-color:var(--wall)}
.note.red b{color:var(--wall-deep)}

/* ============================================================
   DAY 导航
   ============================================================ */
.days{position:sticky;top:0;z-index:20;background:rgba(245,242,234,.93);
  backdrop-filter:blur(10px);padding:11px 0;margin-bottom:8px;border-bottom:1px solid var(--rule)}
.days .row{display:flex;gap:8px;overflow-x:auto}
.day-btn{flex:0 0 auto;min-height:40px;padding:0 20px;border-radius:2px;cursor:pointer;
  border:1px solid var(--rule-strong);background:transparent;color:var(--ink-soft);
  font-family:var(--font-title);font-size:.9rem;font-weight:600;letter-spacing:.12em;
  transition:all .22s ease}
.day-btn:hover{border-color:var(--wall);color:var(--wall)}
.day-btn[aria-selected="true"]{background:var(--wall);border-color:var(--wall);color:#fff}
